name: Publicar site no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar site Imperium
        run: |
          mkdir -p imperium
          cat deploy_payload/imperium/part-*.txt | tr -d '\n' | base64 -d | tar -xz -C imperium
          rm -rf deploy_payload
          test -f imperium/index.html
          test -f imperium/styles.css
          test -f imperium/js/main.js

      - name: Ativar GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages" -f build_type=workflow || \
          gh api --method PUT "repos/${{ github.repository }}/pages" -f build_type=workflow || true

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
